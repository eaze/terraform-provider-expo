name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test $(go list ./... | grep -v '/internal/eas/test') -count=1

  release:
    needs: verify
    uses: hashicorp/ghaction-terraform-provider-release/.github/workflows/community.yml@v5
    with:
      setup-go-version-file: go.mod
    secrets:
      gpg-private-key: ${{ secrets.TERRAFORM_PROVIDER_EXPO_GPG_PRIVATE_KEY }}
      gpg-private-key-passphrase: ${{ secrets.TERRAFORM_PROVIDER_EXPO_GPG_PASSPHRASE }}
